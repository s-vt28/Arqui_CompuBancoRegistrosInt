## =====================================================================
## project.properties - Configuración del proyecto BancoRegistrosInteractivo
##
## Archivo gestionado por NetBeans. Define qué clase es el "main", dónde
## están las fuentes y qué versión de Java compilar.
##
## Java 17 está fijado como objetivo porque el código usa `record` (Java 14+)
## y `Map.copyOf` (Java 10+). NetBeans 17+ trae JDK 17 por defecto; si tienes
## una versión más nueva (21, 23) también funciona — solo asegúrate de tener
## un JDK >= 17 instalado.
## =====================================================================

annotation.processing.enabled=true
annotation.processing.enabled.in.editor=false
annotation.processing.processors.list=
annotation.processing.run.all.processors=true
annotation.processing.source.output=${build.generated.sources.dir}/ap-source-output

application.title=BancoRegistrosInteractivo
application.vendor=Converzzo

build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
build.sysclasspath=ignore
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results

debug.classpath=${run.classpath}
debug.modulepath=\
    ${run.modulepath}
debug.test.classpath=${run.test.classpath}

debug.test.modulepath=\
    ${run.test.modulepath}
dist.archive.excludes=
dist.dir=dist
dist.jar=${dist.dir}/BancoRegistrosInteractivo.jar
dist.javadoc.dir=${dist.dir}/javadoc
dist.jlink.dir=${dist.dir}/jlink
dist.jlink.output=${dist.jlink.dir}/BancoRegistrosInteractivo

excludes=
includes=**

jar.archive.disabled=${jnlp.enabled}
jar.compress=false
jar.index=${jnlp.enabled}

javac.classpath=
javac.compilerargs=-Xlint:all
javac.deprecation=false
javac.external.vm=true
javac.modulepath=
javac.processormodulepath=
javac.processorpath=${javac.classpath}
javac.source=17
javac.target=17
javac.test.classpath=${javac.classpath}:${build.classes.dir}
javac.test.modulepath=\
    ${javac.modulepath}
javac.test.processorpath=${javac.test.classpath}

javadoc.additionalparam=
javadoc.author=true
javadoc.encoding=${source.encoding}
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=true
javadoc.windowtitle=BancoRegistrosInteractivo

# Clase con el método main que se ejecuta al pulsar F6 / botón Run
main.class=Main

manifest.file=manifest.mf
meta.inf.dir=${src.dir}/META-INF
mkdist.disabled=false

platform.active=default_platform

run.classpath=${javac.classpath}:${build.classes.dir}
run.jvmargs=
run.modulepath=\
    ${javac.modulepath}
run.test.classpath=${javac.test.classpath}:${build.test.classes.dir}

run.test.modulepath=\
    ${javac.test.modulepath}
source.encoding=UTF-8
src.dir=src
test.src.dir=test
